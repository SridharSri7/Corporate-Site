<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h2>Stackly</h2>

    <ul>
      <li><a href="#">Dashboard</a></li>
      <li class="admin-only"><a href="#">Admin Panel</a></li>
      <li class="manager-only"><a href="#">Team Reports</a></li>
      <li><a href="#">Profile</a></li>
      <li><a href="#" onclick="logout()">Logout</a></li>
    </ul>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main">

    <div class="topbar">
      <h1>Welcome, <span id="userName">User</span> 👋</h1>
      <p id="userRole"></p>
    </div>

    <!-- DASHBOARD CARDS -->
    <div class="cards">

      <div class="card admin-only">
        <h3>Admin Stats</h3>
        <p>Manage users & system settings</p>
      </div>

      <div class="card manager-only">
        <h3>Team Performance</h3>
        <p>View team analytics</p>
      </div>

      <div class="card">
        <h3>My Tasks</h3>
        <p>Personal dashboard overview</p>
      </div>

      <div class="card">
        <h3>Notifications</h3>
        <p>Latest updates and alerts</p>
      </div>

    </div>

  </main>

</div>

<script src="js/auth.js"></script>
<script src="js/dashboard.js"></script>

</body>
</html>
