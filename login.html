<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Stackly</title>

  <link rel="stylesheet" href="css/login.css">
</head>
<body>

<!-- BACKGROUND -->
<div class="bg-glow"></div>

<!-- MAIN CONTAINER -->
<div class="auth-container">

  <!-- LEFT SIDE -->
  <div class="auth-left">

    <h1>Welcome Back 👋</h1>

    <p>
      Login to access your dashboard, analytics,
      tasks and management system.
    </p>

    <div class="feature-list">
      <div class="feature-card">📊 Real-time Analytics</div>
      <div class="feature-card">⚡ Fast Dashboard</div>
      <div class="feature-card">🔒 Secure Authentication</div>
    </div>

  </div>

  <!-- RIGHT SIDE -->
  <div class="auth-right">

    <div class="login-box">

      <h2>Login</h2>
      <span>Access your account</span>

      <input id="email" type="email" placeholder="Enter Email">

      <input id="password" type="password" placeholder="Enter Password">

      <select id="role">
        <option value="user">User</option>
        <option value="manager">Manager</option>
        <option value="admin">Admin</option>
      </select>

      <button onclick="login()">Login</button>

      <p class="switch-page">
        Don't have an account?
        <a href="signup.html">Signup</a>
      </p>

    </div>

  </div>

</div>

<script src="javaScript/auth.js"></script>

</body>
</html>
